[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqxva"
version = "0.1.0"
description = "Exposure engine (EE/NEE/PFE/funding exposure/SA-CCR) for XVA pricing of equity TRS and European options"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "openpyxl"]

[project.optional-dependencies]
excel = ["xlwings"]
bloomberg = ["xbbg"]
dev = ["pytest"]

[project.scripts]
eqxva = "eqxva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
